name: Autoship Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run test:runner
      - run: npm run build
      - name: Prepare production env
        run: |
          cp .env.production.example .env.production
          sed -i 's/replace-with-strong-password/ci-postgres-password/g' .env.production
          sed -i 's/replace-with-64-byte-random-token/ci-api-token/g' .env.production
          sed -i 's/replace-with-different-64-byte-random-token/ci-runner-token/g' .env.production
          sed -i 's#replace-me@postgres#ci-postgres-password@postgres#g' .env.production
      - name: Validate production compose syntax
        run: docker compose --env-file .env.production -f docker-compose.production.yml config
      - name: Build control plane image
        run: docker build -t autoship-control-plane:ci .
      - name: Build runner image
        run: docker build -f Dockerfile.runner -t autoship-runner:ci .
      - name: Start production stack
        run: docker compose --env-file .env.production -f docker-compose.production.yml up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" && docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then exit 0; fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.production.yml ps
          docker compose --env-file .env.production -f docker-compose.production.yml logs --no-color
          exit 1
      - name: Verify production auth
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://127.0.0.1:3000/api/projects/upsert',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({repoUrl:'https://github.com/zskbot/AgentsIDE'})}).then(async r=>{console.log(await r.text());process.exit(r.status===401?0:1)}).catch(()=>process.exit(1))"
      - name: Verify runner isolation endpoint
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://autoship-runner:3100/health').then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
      - name: Verify persistent database state
        run: |
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://127.0.0.1:3000/api/projects/upsert',{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer ci-api-token'},body:JSON.stringify({repoUrl:'https://github.com/zskbot/AgentsIDE',name:'AgentsIDE'})}).then(async r=>{console.log(await r.text());process.exit(r.ok?0:1)}).catch(()=>process.exit(1))"
          docker compose --env-file .env.production -f docker-compose.production.yml restart autoship-control-plane
          sleep 5
          docker compose --env-file .env.production -f docker-compose.production.yml exec -T autoship-control-plane node -e "fetch('http://127.0.0.1:3000/api/projects',{headers:{authorization:'Bearer ci-api-token'}}).then(async r=>{const t=await r.text();console.log(t);process.exit(r.ok&&t.includes('AgentsIDE')?0:1)}).catch(()=>process.exit(1))"
      - name: Cleanup
        if: always()
        run: |
          if [[ -f .env.production ]]; then
            docker compose --env-file .env.production -f docker-compose.production.yml down -v
          else
            docker compose -f docker-compose.production.yml down -v
          fi
