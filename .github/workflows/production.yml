name: Autoship Production Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  production-stack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run lint
      - run: npm run test:runner
      - run: npm run build
      - name: Validate production compose syntax
        run: |
          cp .env.production.example .env.production
          sed -i 's/replace-with-strong-password/ci-postgres-password/' .env.production
          sed -i 's/replace-with-64-byte-random-token/ci-api-token/' .env.production
          sed -i '0,/replace-with-different-64-byte-random-token/s//ci-runner-token/' .env.production
          docker compose -f docker-compose.production.yml config
      - name: Build control plane image
        run: docker build -t autoship-control-plane:ci .
      - name: Build runner image
        run: docker build -f Dockerfile.runner -t autoship-runner:ci .
      - name: Start production stack
        run: docker compose -f docker-compose.production.yml up -d --build
      - name: Wait for readiness
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null && curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then exit 0; fi
            sleep 2
          done
          docker compose -f docker-compose.production.yml ps
          docker compose -f docker-compose.production.yml logs --no-color
          exit 1
      - name: Verify production auth
        run: |
          code=$(curl -sS -o /tmp/auth-body -w '%{http_code}' -X POST http://127.0.0.1:3000/api/projects/upsert -H 'Content-Type: application/json' --data '{"repoUrl":"https://github.com/zskbot/AgentsIDE"}')
          test "$code" = "401"
      - name: Verify runner isolation endpoint
        run: |
          curl -fsS http://127.0.0.1:3000/api/health | grep -q '"runnerEnabled":false'
          docker compose -f docker-compose.production.yml exec -T autoship-runner curl -fsS http://127.0.0.1:3100/health
      - name: Verify persistent database state
        run: |
          curl -fsS -H 'Authorization: Bearer ci-api-token' -X POST http://127.0.0.1:3000/api/projects/upsert -H 'Content-Type: application/json' --data '{"repoUrl":"https://github.com/zskbot/AgentsIDE","name":"AgentsIDE"}' | grep -q 'proj-'
          docker compose -f docker-compose.production.yml restart autoship-control-plane
          sleep 3
          curl -fsS -H 'Authorization: Bearer ci-api-token' http://127.0.0.1:3000/api/projects | grep -q 'AgentsIDE'
      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.production.yml down -v
