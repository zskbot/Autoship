name: Deploy Autoship Control Plane to Cloudflare

on:
  push:
    branches: [main]
    paths:
      - 'cloudflare/**'
      - '.github/workflows/deploy-autoship-cloudflare.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloudflare
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cloudflare/package.json
      - run: npm install
      - name: Validate required secrets and Cloudflare access
        env:
          AUTOSHIP_API_TOKEN: ${{ secrets.AUTOSHIP_API_TOKEN }}
          AUTOSHIP_GITHUB_TOKEN: ${{ secrets.AUTOSHIP_GITHUB_TOKEN }}
          CLOUDFLARE_WORKERS_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${AUTOSHIP_API_TOKEN:-}" ]] || missing+=(AUTOSHIP_API_TOKEN)
          [[ -n "${AUTOSHIP_GITHUB_TOKEN:-}" ]] || missing+=(AUTOSHIP_GITHUB_TOKEN)
          [[ -n "${CLOUDFLARE_WORKERS_API_TOKEN:-}" ]] || missing+=(CLOUDFLARE_WORKERS_API_TOKEN)
          [[ -n "${CLOUDFLARE_D1_API_TOKEN:-}" ]] || missing+=(CLOUDFLARE_D1_API_TOKEN)
          [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then printf 'Missing required GitHub Actions secrets: %s\n' "${missing[*]}" >&2; exit 1; fi
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID must be the 32-character Cloudflare Account ID, not Zone ID.' >&2; exit 1; }
          d1_json="$(curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" -H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" -H 'Accept: application/json')"
          jq -e '.success == true and (.result | type == "array")' >/dev/null <<<"${d1_json}" || { echo 'Cloudflare D1 token is invalid for this account or lacks D1 Read/Edit permission.' >&2; exit 1; }
          echo 'Cloudflare D1 token is accepted.'
          echo 'Cloudflare Workers token will be used only for Worker deployment.'
      - name: Provision D1 database
        env:
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_D1_API_TOKEN}" -H 'Accept: application/json')
          list_json="$(curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database?per_page=100" "${auth[@]}")"
          db_id="$(jq -r '.result[] | select(.name=="autoship") | .uuid' <<<"${list_json}" | head -n1)"
          if [[ -z "$db_id" || "$db_id" == "null" ]]; then
            create_json="$(curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database" "${auth[@]}" -H 'Content-Type: application/json' --data '{"name":"autoship","location":"apac"}')"
            jq -e '.success == true and (.result.uuid | type == "string")' >/dev/null <<<"${create_json}" || { echo 'Cloudflare could not create the autoship D1 database.' >&2; cat <<<"${create_json}"; exit 1; }
            db_id="$(jq -r '.result.uuid' <<<"${create_json}")"
          fi
          [[ "$db_id" =~ ^[0-9a-fA-F-]{36}$ ]] || { echo 'Unable to determine D1 database id' >&2; exit 1; }
          sed -i "s/REPLACE_WITH_D1_DATABASE_ID/$db_id/" wrangler.toml
          schema_json="$(jq -Rs '{sql: .}' schema.sql)"
          query_json="$(curl --fail-with-body --silent --show-error -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${db_id}/query" "${auth[@]}" -H 'Content-Type: application/json' --data "${schema_json}")"
          jq -e '.success == true' >/dev/null <<<"${query_json}" || { echo 'Cloudflare D1 schema execution failed.' >&2; cat <<<"${query_json}"; exit 1; }
          echo "D1 database ready: ${db_id}"
      - name: Set Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTOSHIP_API_TOKEN: ${{ secrets.AUTOSHIP_API_TOKEN }}
          AUTOSHIP_GITHUB_TOKEN: ${{ secrets.AUTOSHIP_GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$AUTOSHIP_API_TOKEN" | npx wrangler@4 secret put AUTOSHIP_API_TOKEN
          printf '%s' "$AUTOSHIP_GITHUB_TOKEN" | npx wrangler@4 secret put AUTOSHIP_GITHUB_TOKEN
      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 deploy
      - name: Verify public Worker endpoint
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --retry 8 --retry-delay 5 --retry-connrefused --fail-with-body --silent --show-error https://autoship.velclaw.cfd/api/health)"
          echo "$health"
          printf '%s' "$health" | jq -e '.ok == true' >/dev/null
          echo 'Autoship public health endpoint is reachable.'
